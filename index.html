<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juan Pablo Guerrero - CEO & Fundador | Laibe Studio AI</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    
    <meta name="description" content="Tarjeta de visita digital de Juan Pablo Guerrero, CEO y Fundador de Laibe Studio AI.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        cyber: {
                            black: '#000000',
                            dark: '#04030d',
                            card: '#0a0918',
                            blue: '#0088ff',
                            purple: '#7f00ff',
                            magenta: '#e100ff',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style type="text/css">
        body {
            background-color: #000000;
            background-image: 
                radial-gradient(at 0% 0%, hsla(220,100%,10%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(270,100%,8%,1) 0, transparent 50%), 
                radial-gradient(at 50% 100%, hsla(240,100%,12%,1) 0, transparent 60%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        .grid-overlay {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(0, 136, 255, 0.015) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 136, 255, 0.015) 1px, transparent 1px);
        }
        .glass-card {
            background: rgba(10, 9, 24, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.7);
        }
        .hover-glow:hover {
            border-color: rgba(0, 136, 255, 0.4);
            box-shadow: 0 0 25px rgba(0, 136, 255, 0.15);
            transform: translateY(-2px);
        }
        .logo-gradient-ring {
            background: linear-gradient(135deg, #0088ff 0%, #7f00ff 100%);
        }
        #qrcode-canvas {
            display: block;
            margin: 0 auto;
            border-radius: 12px;
            max-width: 100%;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="text-slate-200 font-sans flex flex-col items-center justify-between min-h-screen relative overflow-x-hidden px-4 py-8">

    <div class="absolute inset-0 grid-overlay pointer-events-none z-0"></div>

    <main class="w-full max-w-md mx-auto z-10 flex-1 flex flex-col justify-center my-auto">
        <div class="glass-card rounded-3xl p-6 relative overflow-hidden transition-all duration-300 hover:border-cyber-blue/30">
            
            <div class="flex flex-col items-center text-center mt-3">
                <div class="relative group">
                    <div class="absolute -inset-1 rounded-full logo-gradient-ring blur opacity-75 animate-pulse-slow"></div>
                    <div class="relative w-24 h-24 rounded-full bg-black flex items-center justify-center border border-white/10 overflow-hidden">
                        <img src="15.png" alt="Laibe Studio AI Logo" class="w-20 h-20 object-contain select-none">
                    </div>
                </div>

                <div class="mt-4">
                    <h1 class="text-2xl font-bold font-display tracking-tight text-white mt-1">Juan Pablo Guerrero</h1>
                    <p class="text-xs font-bold uppercase tracking-widest bg-clip-text text-transparent bg-gradient-to-r from-cyber-blue to-cyber-purple font-display mt-0.5">CEO & Fundador</p>
                    <p class="text-sm text-slate-400 mt-2 font-medium flex items-center justify-center gap-2">
                        <span class="inline-block w-2.5 h-2.5 rounded-full bg-cyber-blue animate-pulse"></span>
                        Laibe Studio AI
                    </p>
                </div>

                <p class="text-xs text-slate-400 max-w-[290px] mt-3 leading-relaxed">
                    Automatización inteligente y soluciones de Inteligencia Artificial para potenciar y escalar tu negocio.
                </p>
            </div>

            <div class="relative my-6 flex items-center justify-center">
                <div class="absolute left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>
                <div class="z-10 px-3 bg-[#0a0918]/90 text-[9px] text-slate-500 font-mono tracking-widest uppercase rounded-full border border-white/5 py-0.5">ESCANEAR CÓDIGO QR</div>
            </div>

            <div class="flex flex-col items-center justify-center my-3">
                <div class="relative p-2.5 rounded-2xl bg-white/5 border border-white/10 shadow-inner">
                    <div class="rounded-xl overflow-hidden bg-white p-2">
                        <div id="qrcode"></div>
                    </div>
                </div>
                <a href="https://laibestudioai.com" target="_blank" class="mt-3 text-xs text-cyber-blue font-mono hover:text-cyan-400 transition-colors flex items-center gap-1 hover:underline">
                    laibestudioai.com <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                </a>
            </div>

            <div class="grid grid-cols-2 gap-3 mt-6">
                <button onclick="downloadVCard()" class="col-span-2 py-3 px-4 rounded-xl logo-gradient-ring text-white font-medium text-sm flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95 group">
                    <i class="fa-solid fa-user-plus"></i>
                    Añadir a Contactos
                </button>
            </div>

            <div class="flex flex-col gap-2.5 mt-4">
                
                <a href="https://laibestudioai.com" target="_blank" class="w-full py-3 px-4 rounded-xl glass-card text-white hover-glow font-medium text-sm flex items-center justify-between transition-all group">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-cyber-blue/15 border border-cyber-blue/30 flex items-center justify-center text-cyber-blue">
                            <i class="fa-solid fa-globe"></i>
                        </div>
                        <span>Visitar Web</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:translate-x-1 transition-all"></i>
                </a>

                <a href="https://wa.me/34633557024?text=Hola%20Juan%20Pablo" target="_blank" class="w-full py-3 px-4 rounded-xl glass-card text-white hover-glow font-medium text-sm flex items-center justify-between transition-all group">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
                            <i class="fa-brands fa-whatsapp text-lg"></i>
                        </div>
                        <span>Enviar WhatsApp</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:translate-x-1 transition-all"></i>
                </a>

                <a href="https://instagram.com/juanpabloguerre.ai" target="_blank" class="w-full py-3 px-4 rounded-xl glass-card text-white hover-glow font-medium text-sm flex items-center justify-between transition-all group">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-amber-500/10 via-red-500/10 to-purple-500/10 border border-red-500/20 flex items-center justify-center text-pink-400">
                            <i class="fa-brands fa-instagram text-lg"></i>
                        </div>
                        <span>Instagram</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:translate-x-1 transition-all"></i>
                </a>

                <a href="tel:+34633557024" class="w-full py-3 px-4 rounded-xl glass-card text-white hover-glow font-medium text-sm flex items-center justify-between transition-all group">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-cyber-purple/15 border border-cyber-purple/30 flex items-center justify-center text-cyber-purple">
                            <i class="fa-solid fa-phone"></i>
                        </div>
                        <span>Llamar ahora</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:translate-x-1 transition-all"></i>
                </a>
            </div>
        </div>
    </main>

    <script>
        // Renderizado del QR robusto
        document.addEventListener("DOMContentLoaded", () => {
            new QRCode(document.getElementById("qrcode"), {
                text: "https://laibestudioai.com",
                width: 140,
                height: 140,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        });

        function downloadVCard() {
            const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:Juan Pablo Guerrero\nORG:Laibe Studio AI\nTITLE:CEO & Fundador\nTEL;TYPE=CELL,VOICE:+34633557024\nURL:https://laibestudioai.com\nEND:VCARD`;
            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = 'Juan_Pablo_Guerrero.vcf';
            link.href = url;
            link.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
